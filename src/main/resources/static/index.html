<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Agent · 后端资源</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f6f7f2; color: #203b30; font: 15px/1.8 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
        main { width: min(920px, calc(100% - 40px)); margin: 70px auto; }
        .eyebrow { color: #6a7a70; letter-spacing: 2px; font-size: 12px; }
        h1 { font-size: 34px; margin: 10px 0; }
        p { color: #6a7a70; }
        .front { background: #eaf0e4; padding: 26px; border-radius: 16px; margin: 30px 0; }
        .front a { display: inline-block; background: #2b624b; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; }
        .front p { margin-bottom: 0; font-size: 13px; }
        code { background: #fffefa; padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .grid a { color: inherit; text-decoration: none; border: 1px solid #dfe5dc; border-radius: 12px; padding: 22px; background: #fffefa; }
        .grid a:hover { border-color: #7f9a72; }
        .grid span { display: block; font-size: 12px; color: #6a7a70; margin-top: 6px; }
        nav { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 30px; font-size: 12px; }
        nav a { color: #45664a; }
        a:focus-visible { outline: 3px solid #b58a45; outline-offset: 4px; }
        @media (max-width: 640px) { main { margin: 35px auto; } .grid { grid-template-columns: 1fr; } h1 { font-size: 28px; } }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">AI AGENT · 从零实现</div>
    <h1>后端已启动，从这里开始。</h1>
    <p>聊天界面已拆分到独立的 Vue 3 项目。这里保留接口与开发资源入口。</p>
    <section class="front" aria-label="本地前端入口">
        <a href="http://localhost:5174/" target="_blank" rel="noopener">打开本地聊天工作台 ↗</a>
        <p>先在 <code>code/ai-agent-front</code> 运行 <code>npm run dev</code>。此链接用于本机开发，端口为 5174；生产部署请使用实际前端地址。</p>
    </section>
    <div class="grid">
        <a href="./swagger-ui.html" target="_blank" rel="noopener"><strong>接口文档 ↗</strong><span>查看参数，在 Swagger 中调试</span></a>
        <a href="./api/health" target="_blank" rel="noopener"><strong>健康检查 ↗</strong><span>检查 HTTP 服务是否可访问</span></a>
        <a href="./v3/api-docs" target="_blank" rel="noopener"><strong>OpenAPI JSON ↗</strong><span>查看机器可读的接口描述</span></a>
    </div>
    <nav aria-label="官方参考文档">
        <a href="https://docs.spring.io/spring-boot/reference/" target="_blank" rel="noopener noreferrer">Spring Boot ↗</a>
        <a href="https://springdoc.org/" target="_blank" rel="noopener noreferrer">SpringDoc ↗</a>
        <a href="https://developers.openai.com/api/reference/java" target="_blank" rel="noopener noreferrer">OpenAI Java SDK ↗</a>
    </nav>
</main>
</body>
</html>
